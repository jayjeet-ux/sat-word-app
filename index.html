<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Word Practice</title>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:system-ui, Arial, sans-serif;
      background:#0b0f19;
      color:#eef2ff;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:14px;
      box-sizing:border-box;
    }
    .card{
      width:96vw;
      max-width:820px;
      background:#111a2e;
      border-radius:18px;
      padding:18px;
      box-sizing:border-box;
      text-align:center;
    }
    h1{
      margin:6px 0 12px 0;
      font-size:22px;
      font-weight:700;
    }

    #alphaFilters{
      display:flex;
      gap:8px;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .alpha-filter{
      border:none;
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      background:rgba(255,255,255,0.10);
      color:#eef2ff;
      cursor:pointer;
      min-width:44px;
      touch-action:manipulation;
    }
    .alpha-filter.active{
      background:rgba(255,255,255,0.18);
      outline:1px solid rgba(255,255,255,0.25);
    }

    #wordDisplay{
      font-size:34px;
      font-weight:800;
      margin-top:8px;
      line-height:1.15;
      word-break:break-word;
    }
    #metaDisplay{
      margin-top:6px;
      font-size:14px;
      color:rgba(238,242,255,0.82);
    }

    .panel{
      margin-top:12px;
      background:rgba(255,255,255,0.06);
      border-radius:14px;
      padding:12px;
      text-align:left;
    }
    .label{
      font-size:13px;
      color:rgba(238,242,255,0.75);
      margin-bottom:6px;
    }
    #definitionDisplay, #exampleDisplay{
      font-size:16px;
      line-height:1.35;
      white-space:pre-wrap;
      word-break:break-word;
    }

    #counter{
      margin-top:12px;
      font-size:13px;
      color:rgba(238,242,255,0.85);
      background:rgba(255,255,255,0.06);
      border-radius:12px;
      padding:10px 12px;
      text-align:left;
    }

    #status{
      margin-top:10px;
      font-size:13px;
      color:rgba(238,242,255,0.70);
      text-align:left;
      padding:0 2px;
    }

    .btnRow{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .btn{
      border:none;
      border-radius:14px;
      padding:12px 14px;
      font-size:15px;
      font-weight:650;
      color:#0b0f19;
      min-width:170px;
      cursor:pointer;
      touch-action:manipulation;
      box-shadow:0 10px 22px rgba(0,0,0,0.22);
    }
    .btn:active{ transform:scale(0.98); }

    .btn-next{
      background:linear-gradient(135deg,#22c55e,#16a34a);
      color:#06110a;
    }
    .btn-meaning-nosound{
      background:linear-gradient(135deg,#a78bfa,#7c3aed);
      color:#070215;
    }
    .btn-meaning-speak{
      background:linear-gradient(135deg,#60a5fa,#2563eb);
      color:#06101f;
    }
    .btn-example-nosound{
      background:linear-gradient(135deg,#fcd34d,#f59e0b);
      color:#201401;
    }
    .btn-example-speak{
      background:linear-gradient(135deg,#fb7185,#e11d48);
      color:#220107;
    }

    @media (max-width:420px){
      #wordDisplay{ font-size:30px; }
      .btn{ min-width:150px; padding:12px 12px; }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Random Word Meaning Game</h1>

    <div id="alphaFilters"></div>

    <div id="wordDisplay">Press Next Word to start</div>
    <div id="metaDisplay"></div>

    <div class="panel">
      <div class="label">Meaning</div>
      <div id="definitionDisplay"></div>
    </div>

    <div class="panel">
      <div class="label">Example</div>
      <div id="exampleDisplay"></div>
    </div>

    <div id="counter">Filter: All. Remaining before reset: 0 of 0.</div>
    <div id="status">Loading vocabulary...</div>

    <div class="btnRow">
      <button class="btn btn-next" id="nextButton">Next Word</button>
    </div>

    <div class="btnRow">
      <button class="btn btn-meaning-nosound" id="showDefOnly">Show Meaning No Sound</button>
      <button class="btn btn-meaning-speak" id="showDefSpeak">Show Meaning Speak</button>
    </div>

    <div class="btnRow">
      <button class="btn btn-example-nosound" id="showExOnly">Show Example No Sound</button>
      <button class="btn btn-example-speak" id="showExSpeak">Show Example Speak</button>
    </div>
  </div>

  <script>
    const CSV_URL = "./sat_vocabulary.csv";

    let allWords = [];
    let filteredWords = [];
    let usedIndexes = new Set();
    let currentWord = null;
    let currentFilter = "all";

    const alphaFiltersEl = document.getElementById("alphaFilters");
    const wordDisplay = document.getElementById("wordDisplay");
    const definitionDisplay = document.getElementById("definitionDisplay");
    const exampleDisplay = document.getElementById("exampleDisplay");
    const metaDisplay = document.getElementById("metaDisplay");
    const statusEl = document.getElementById("status");
    const counterEl = document.getElementById("counter");

    function setStatus(msg){ statusEl.textContent = msg; }

    function setCounter(){
      const total = filteredWords.length;
      const remaining = total - usedIndexes.size;
      const label = currentFilter === "all" ? "All" : currentFilter;
      counterEl.textContent = "Filter: " + label + ". Remaining before reset: " + remaining + " of " + total + ".";
    }

    function normalizeRow(r){
      const word = ((r.word || r.Word || "") + "").trim();
      const definition = ((r.definition || r.Definition || "") + "").trim();
      const part = ((r["part of speech"] || r["Part of Speech"] || r.part || "") + "").trim();
      const example = ((r.example || r.Example || "") + "").trim();
      return { word, definition, part, example };
    }

    function buildAlphabetButtons(){
      alphaFiltersEl.innerHTML = "";

      const makeBtn = (label, value, active) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.className = "alpha-filter" + (active ? " active" : "");
        b.dataset.letter = value;
        return b;
      };

      alphaFiltersEl.appendChild(makeBtn("All","all",true));
      for(let i=65;i<=90;i++){
        const letter = String.fromCharCode(i);
        alphaFiltersEl.appendChild(makeBtn(letter,letter,false));
      }

      alphaFiltersEl.addEventListener("click", (e) => {
        const btn = e.target.closest("button.alpha-filter");
        if(!btn) return;

        currentFilter = btn.dataset.letter;

        Array.from(alphaFiltersEl.querySelectorAll(".alpha-filter")).forEach(b=>{
          b.classList.toggle("active", b.dataset.letter === currentFilter);
        });

        applyFilter();
      });
    }

    function loadCSV(){
      setStatus("Loading vocabulary...");

      fetch(CSV_URL, { cache: "no-store" })
        .then(r => {
          if(!r.ok) throw new Error("CSV fetch failed. Status " + r.status);
          return r.text();
        })
        .then(text => {
          const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });

          allWords = (parsed.data || [])
            .map(normalizeRow)
            .filter(x => x.word.length > 0 && (x.definition.length > 0 || x.example.length > 0));

          filteredWords = allWords;
          usedIndexes.clear();
          currentFilter = "all";

          if(!allWords.length){
            setStatus("CSV loaded but 0 usable rows. Check headers word, definition, part of speech, example.");
            setCounter();
            return;
          }

          setStatus("Loaded " + allWords.length + " words.");
          setCounter();
        })
        .catch(err => {
          setStatus(err.message);
          setCounter();
        });
    }

    function applyFilter(){
      if(!allWords.length){
        setStatus("No words loaded yet.");
        setCounter();
        return;
      }

      filteredWords = currentFilter === "all"
        ? allWords
        : allWords.filter(w => (w.word[0] || "").toUpperCase() === currentFilter);

      usedIndexes.clear();
      currentWord = null;

      wordDisplay.textContent = "Press Next Word to start";
      metaDisplay.textContent = "";
      definitionDisplay.textContent = "";
      exampleDisplay.textContent = "";

      setStatus("Ready.");
      setCounter();
    }

    function getNextWord(){
      if(!filteredWords.length) return null;

      let available = filteredWords.map((_,i)=>i).filter(i => !usedIndexes.has(i));
      if(!available.length){
        usedIndexes.clear();
        available = filteredWords.map((_,i)=>i);
      }

      const idx = available[Math.floor(Math.random() * available.length)];
      usedIndexes.add(idx);
      return filteredWords[idx];
    }

    function showNextWord(){
      if(!allWords.length){
        setStatus("Words not loaded. Check CSV.");
        setCounter();
        return;
      }
      if(!filteredWords.length){
        setStatus("No words for this filter.");
        setCounter();
        return;
      }

      currentWord = getNextWord();
      if(!currentWord){
        setCounter();
        return;
      }

      wordDisplay.textContent = currentWord.word;
      metaDisplay.textContent = currentWord.part ? ("Part of speech: " + currentWord.part) : "";
      definitionDisplay.textContent = "";
      exampleDisplay.textContent = "";

      setStatus("Ready.");
      setCounter();
    }

    function speakWordThenText(word, text){
      if(!word || !text) return;

      try{
        speechSynthesis.cancel();

        const uWord = new SpeechSynthesisUtterance(word);
        uWord.rate = 0.65;

        const uText = new SpeechSynthesisUtterance(text);
        uText.rate = 1.0;

        uWord.onend = () => {
          setTimeout(() => speechSynthesis.speak(uText), 500);
        };

        speechSynthesis.speak(uWord);
      }catch(e){
        setStatus("Speech not available in this browser.");
      }
    }

    function showMeaning(playSound){
      if(!currentWord) return;
      const def = currentWord.definition || "";
      definitionDisplay.textContent = def ? def : "No meaning available.";
      if(playSound && def) speakWordThenText(currentWord.word, def);
    }

    function showExample(playSound){
      if(!currentWord) return;
      const ex = currentWord.example || "";
      exampleDisplay.textContent = ex ? ex : "No example available.";
      if(playSound && ex) speakWordThenText(currentWord.word, ex);
    }

    document.getElementById("nextButton").addEventListener("click", showNextWord);

    document.getElementById("showDefOnly").addEventListener("click", () => showMeaning(false));
    document.getElementById("showDefSpeak").addEventListener("click", () => showMeaning(true));

    document.getElementById("showExOnly").addEventListener("click", () => showExample(false));
    document.getElementById("showExSpeak").addEventListener("click", () => showExample(true));

    buildAlphabetButtons();
    loadCSV();
  </script>
</body>
</html>

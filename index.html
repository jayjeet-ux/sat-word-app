<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Word Meaning Game</title>

  <!-- PapaParse -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
    }
    .alpha-filter {
      margin: 3px;
      padding: 4px 8px;
      cursor: pointer;
    }
    #wordDisplay {
      font-size: 24px;
      margin-top: 15px;
    }
    #definitionDisplay {
      font-size: 18px;
      margin-top: 10px;
      color: #333;
    }
    #status {
      margin-top: 8px;
      color: #555;
    }
    button {
      margin-right: 6px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<h1>Random Word Meaning Game</h1>

<div id="alphaFilters"></div>

<div id="wordDisplay">Press "Next Word" to start</div>
<div id="definitionDisplay"></div>
<div id="status">Loading vocabulary…</div>

<button id="nextButton">Next Word</button>
<button id="showMeaning">Show Meaning</button>
<button id="showMeaningOnly">Show Meaning (No Sound)</button>

<script>
  const CSV_FILE = "sat_vocabulary.csv";

  let allWords = [];
  let filteredWords = [];
  let usedIndexes = new Set();
  let currentWord = null;
  let currentFilter = "all";

  const wordDisplay = document.getElementById("wordDisplay");
  const definitionDisplay = document.getElementById("definitionDisplay");
  const statusEl = document.getElementById("status");

  function buildAlphabetButtons() {
    const container = document.getElementById("alphaFilters");
    container.innerHTML = "";

    const makeBtn = (label, value) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.className = "alpha-filter";
      b.dataset.letter = value;
      return b;
    };

    container.appendChild(makeBtn("All", "all"));

    for (let i = 65; i <= 90; i++) {
      container.appendChild(makeBtn(String.fromCharCode(i), String.fromCharCode(i)));
    }

    container.addEventListener("click", e => {
      if (!e.target.dataset.letter) return;
      currentFilter = e.target.dataset.letter;
      applyFilter();
    });
  }

  function loadCSV() {
    Papa.parse(CSV_FILE, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: res => {
        allWords = res.data
          .map(r => ({
            word: (r.word || "").trim(),
            definition: (r.definition || "").trim(),
            part: (r["part of speech"] || "").trim(),
            example: (r.example || "").trim()
          }))
          .filter(r => r.word && r.definition);

        filteredWords = allWords;
        usedIndexes.clear();

        statusEl.textContent = "Loaded " + allWords.length + " words";
      },
      error: () => {
        statusEl.textContent = "Failed to load CSV";
      }
    });
  }

  function applyFilter() {
    if (currentFilter === "all") {
      filteredWords = allWords;
    } else {
      filteredWords = allWords.filter(w => w.word[0].toUpperCase() === currentFilter);
    }
    usedIndexes.clear();
    wordDisplay.textContent = 'Press "Next Word" to start';
    definitionDisplay.textContent = "";
    statusEl.textContent = "Filter: " + currentFilter + " (" + filteredWords.length + " words)";
  }

  function getNextWord() {
    if (filteredWords.length === 0) return null;

    let available = filteredWords
      .map((_, i) => i)
      .filter(i => !usedIndexes.has(i));

    if (available.length === 0) {
      usedIndexes.clear();
      available = filteredWords.map((_, i) => i);
    }

    const idx = available[Math.floor(Math.random() * available.length)];
    usedIndexes.add(idx);
    return filteredWords[idx];
  }

  function showNextWord() {
    currentWord = getNextWord();
    if (!currentWord) return;

    wordDisplay.textContent = currentWord.word;
    definitionDisplay.textContent = "";
  }

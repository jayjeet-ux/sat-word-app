<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Word Practice</title>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:system-ui, Arial, sans-serif;
      background:#0b0f19;
      color:#eef2ff;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:14px;
      box-sizing:border-box;
    }
    .card{
      width:96vw;
      max-width:820px;
      background:#111a2e;
      border-radius:18px;
      padding:18px;
      box-sizing:border-box;
      text-align:center;
    }
    h1{
      margin:6px 0 12px 0;
      font-size:22px;
      font-weight:700;
    }

    #alphaFilters{
      display:flex;
      gap:8px;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .alpha-filter{
      border:none;
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      background:#1c2542;
      color:#eef2ff;
    }
    .alpha-filter.active{
      background:#3b82f6;
    }

    #wordDisplay{
      font-size:34px;
      font-weight:800;
      margin-top:8px;
    }
    #metaDisplay{
      margin-top:6px;
      font-size:14px;
      color:#c7d2fe;
    }

    .panel{
      margin-top:12px;
      background:#1a2240;
      border-radius:14px;
      padding:12px;
      text-align:left;
    }
    .label{
      font-size:13px;
      color:#93c5fd;
      margin-bottom:6px;
    }
    #definitionDisplay, #exampleDisplay{
      font-size:16px;
      line-height:1.35;
    }

    #status{
      margin-top:12px;
      font-size:13px;
      color:#a5b4fc;
    }

    .btnRow{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .btn{
      border:none;
      border-radius:14px;
      padding:12px 14px;
      font-size:15px;
      color:#0b0f19;
      min-width:160px;
    }

    .btn-next{ background:#22c55e; }
    .btn-meaning-speak{ background:#60a5fa; }
    .btn-meaning-nosound{ background:#93c5fd; }
    .btn-example-speak{ background:#fbbf24; }
    .btn-example-nosound{ background:#fde68a; }

    @media (max-width:420px){
      #wordDisplay{ font-size:30px; }
      .btn{ min-width:145px; }
    }
  </style>
</head>

<body>
<div class="card">
  <h1>Random Word Meaning Game</h1>

  <div id="alphaFilters"></div>

  <div id="wordDisplay">Press Next Word to start</div>
  <div id="metaDisplay"></div>

  <div class="panel">
    <div class="label">Meaning</div>
    <div id="definitionDisplay"></div>
  </div>

  <div class="panel">
    <div class="label">Example</div>
    <div id="exampleDisplay"></div>
  </div>

  <div id="status">Loading vocabulary...</div>

  <div class="btnRow">
    <button class="btn btn-next" id="nextButton">Next Word</button>
  </div>

  <div class="btnRow">
    <button class="btn btn-meaning-nosound" id="showDefOnly">Meaning No Sound</button>
    <button class="btn btn-meaning-speak" id="showDefSpeak">Meaning Speak</button>
  </div>

  <div class="btnRow">
    <button class="btn btn-example-nosound" id="showExOnly">Example No Sound</button>
    <button class="btn btn-example-speak" id="showExSpeak">Example Speak</button>
  </div>
</div>

<script>
const CSV_URL="./sat_vocabulary.csv";
let allWords=[],filteredWords=[],usedIndexes=new Set(),currentWord=null,currentFilter="all";
const alphaFiltersEl=document.getElementById("alphaFilters");
const wordDisplay=document.getElementById("wordDisplay");
const definitionDisplay=document.getElementById("definitionDisplay");
const exampleDisplay=document.getElementById("exampleDisplay");
const metaDisplay=document.getElementById("metaDisplay");
const statusEl=document.getElementById("status");

function normalizeRow(r){
  return{
    word:(r.word||"").trim(),
    definition:(r.definition||"").trim(),
    part:(r["part of speech"]||"").trim(),
    example:(r.example||"").trim()
  };
}

function buildAlphabetButtons(){
  alphaFiltersEl.innerHTML="";
  const letters=["all",...Array.from({length:26},(_,i)=>String.fromCharCode(65+i))];
  letters.forEach(l=>{
    const b=document.createElement("button");
    b.className="alpha-filter"+(l==="all"?" active":"");
    b.textContent=l==="all"?"All":l;
    b.dataset.letter=l;
    alphaFiltersEl.appendChild(b);
  });
  alphaFiltersEl.onclick=e=>{
    if(!e.target.dataset.letter)return;
    currentFilter=e.target.dataset.letter;
    document.querySelectorAll(".alpha-filter").forEach(b=>b.classList.toggle("active",b.dataset.letter===currentFilter));
    applyFilter();
  };
}

function loadCSV(){
  fetch(CSV_URL).then(r=>r.text()).then(t=>{
    const p=Papa.parse(t,{header:true,skipEmptyLines:true});
    allWords=p.data.map(normalizeRow).filter(x=>x.word);
    filteredWords=allWords;
    statusEl.textContent="Loaded "+allWords.length+" words";
  });
}

function applyFilter(){
  filteredWords=currentFilter==="all"?allWords:allWords.filter(w=>w.word[0].toUpperCase()===currentFilter);
  usedIndexes.clear();
  wordDisplay.textContent="Press Next Word to start";
  definitionDisplay.textContent="";
  exampleDisplay.textContent="";
}

function getNextWord(){
  let idxs=filteredWords.map((_,i)=>i).filter(i=>!usedIndexes.has(i));
  if(!idxs.length){usedIndexes.clear();idxs=filteredWords.map((_,i)=>i);}
  const i=idxs[Math.floor(Math.random()*idxs.length)];
  usedIndexes.add(i);
  return filteredWords[i];
}

function showNextWord(){
  currentWord=getNextWord();
  if(!currentWord)return;
  wordDisplay.textContent=currentWord.word;
  metaDisplay.textContent=currentWord.part;
  definitionDisplay.textContent="";
  exampleDisplay.textContent="";
}

function speakWordThenText(w,t){
  speechSynthesis.cancel();
  const u1=new SpeechSynthesisUtterance(w);u1.rate=0.65;
  const u2=new SpeechSynthesisUtterance(t);
  u1.onend=()=>setTimeout(()=>speechSynthesis.speak(u2),500);
  speechSynthesis.speak(u1);
}

document.getElementById("nextButton").onclick=showNextWord;
document.getElementById("showDefOnly").onclick=()=>definitionDisplay.textContent=currentWord.definition;
document.getElementById("showDefSpeak").onclick=()=>{definitionDisplay.textContent=currentWord.definition;speakWordThenText(currentWord.word,currentWord.definition);};
document.getElementById("showExOnly").onclick=()=>exampleDisplay.textContent=currentWord.example;
document.getElementById("showExSpeak").onclick=()=>{exampleDisplay.textContent=currentWord.example;speakWordThenText(currentWord.word,currentWord.example);};

buildAlphabetButtons();
loadCSV();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Word Practice</title>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
    }
    .alpha-filter {
      margin: 3px;
      padding: 4px 8px;
      cursor: pointer;
    }
    #wordDisplay {
      font-size: 28px;
      margin-top: 16px;
    }
    #definitionDisplay {
      font-size: 18px;
      margin-top: 10px;
    }
    #metaDisplay {
      font-size: 14px;
      margin-top: 6px;
      color: #444;
    }
    #status {
      margin-top: 10px;
      color: #333;
    }
    button {
      margin-right: 6px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<h1>Random Word Meaning Game</h1>

<div id="alphaFilters"></div>

<div id="wordDisplay">Press Next Word to start</div>
<div id="definitionDisplay"></div>
<div id="metaDisplay"></div>
<div id="status">Loading vocabulary…</div>

<button id="nextButton">Next Word</button>
<button id="showMeaning">Show Meaning</button>
<button id="showMeaningOnly">Show Meaning No Sound</button>

<script>
  const CSV_URL = "./sat_vocabulary.csv";

  let allWords = [];
  let filteredWords = [];
  let usedIndexes = new Set();
  let currentWord = null;
  let currentFilter = "all";

  const wordDisplay = document.getElementById("wordDisplay");
  const definitionDisplay = document.getElementById("definitionDisplay");
  const metaDisplay = document.getElementById("metaDisplay");
  const statusEl = document.getElementById("status");

  function setStatus(msg) {
    statusEl.textContent = msg;
  }

  function buildAlphabetButtons() {
    const container = document.getElementById("alphaFilters");
    container.innerHTML = "";

    const makeBtn = (label, value) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.className = "alpha-filter";
      b.dataset.letter = value;
      return b;
    };

    container.appendChild(makeBtn("All", "all"));

    for (let i = 65; i <= 90; i++) {
      const letter = String.fromCharCode(i);
      container.appendChild(makeBtn(letter, letter));
    }

    container.addEventListener("click", e => {
      const btn = e.target.closest("button.alpha-filter");
      if (!btn) return;
      currentFilter = btn.dataset.letter;
      applyFilter();
    });
  }

  function loadCSV() {
    setStatus("loadCSV started. Fetching " + CSV_URL);

    fetch(CSV_URL, { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error("CSV fetch failed. Status " + r.status);
        return r.text();
      })
      .then(text => {
        const parsed = Papa.parse(text, {
          header: true,
          skipEmptyLines: true
        });

        allWords = (parsed.data || [])
          .map(r => ({
            word: ((r.word || r.Word || "") + "").trim(),
            definition: ((r.definition || r.Definition || "") + "").trim(),
            part: ((r["part of speech"] || r["Part of Speech"] || r.part || "") + "").trim(),
            example: ((r.example || r.Example || "") + "").trim()
          }))
          .filter(r => r.word.length > 0 && r.definition.length > 0);

        filteredWords = allWords;
        usedIndexes.clear();

        if (allWords.length === 0) {
          setStatus("CSV loaded but no usable rows. Check headers.");
          return;
        }

        setStatus("Loaded " + allWords.length + " words");
      })
      .catch(err => {
        setStatus(err.message);
      });
  }

  function applyFilter() {
    if (!allWords.length) {
      setStatus("No words loaded yet");
      return;
    }

    if (currentFilter === "all") {
      filteredWords = allWords;
    } else {
      filteredWords = allWords.filter(w => w.word[0].toUpperCase() === currentFilter);
    }

    usedIndexes.clear();
    currentWord = null;

    wordDisplay.textContent = "Press Next Word to start";
    definitionDisplay.textContent = "";
    metaDisplay.textContent = "";

    setStatus("Filter " + (currentFilter === "all" ? "All" : currentFilter) + " with " + filteredWords.length + " words");
  }

  function getNextWord() {
    if (!filteredWords.length) return null;

    let available = filteredWords
      .map((_, i) => i)
      .filter(i => !usedIndexes.has(i));

    if (available.length === 0) {
      usedIndexes.clear();
      available = filteredWords.map((_, i) => i);
    }

    const idx = available[Math.floor(Math.random() * available.length)];
    usedIndexes.add(idx);
    return filteredWords[idx];
  }

  function showNextWord() {
    if (!allWords.length) {
      setStatus("Words not loaded. Check CSV.");
      return;
    }

    currentWord = getNextWord();
    if (!currentWord) return;

    wordDisplay.textContent = currentWord.word;
    definitionDisplay.textContent = "";
    metaDisplay.textContent = currentWord.part ? "Part of speech: " + currentWord.part : "";
  }

  function showMeaning(playSound) {
    if (!currentWord) return;

    definitionDisplay.textContent = currentWord.definition;

    if (playSound) {
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(currentWord.definition));
    }
  }

  document.getElementById("nextButton").onclick = showNextWord;
  document.getElementById("showMeaning").onclick = () => showMeaning(true);
  document.getElementById("showMeaningOnly").onclick = () => showMeaning(false);

  buildAlphabetButtons();
  loadCSV();
</script>

</body>
</html>

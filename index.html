<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Meaning Randomizer</title>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        .alpha-filter { margin: 5px; }
    </style>
</head>
<body>
    <h1>Random Word Meaning Game</h1>
    
    <div id="alphaFilters">
        <button class="alpha-filter" data-letter="all">All</button>
        <script>
            for (let i = 65; i <= 90; i++) {
                document.write(`<button class="alpha-filter" data-letter="${String.fromCharCode(i)}">${String.fromCharCode(i)}</button>`);
            }
        </script>
    </div>
    
    <div id="wordDisplay">Press "Next" to start</div>
    <button id="nextButton">Next Word</button>
    <button id="showMeaning">Show Meaning</button>
    <button id="showMeaningOnly">Show Meaning (No Sound)</button>

    <script>
        let words = [];
        let filteredWords = [];
        let currentWord = null;
        let usedIndices = new Set(); // Track used indices to avoid repetition

        function loadCSV(callback) {
            Papa.parse('sat_vocabulary.csv', {
                download: true,
                header: true,
                complete: function(results) {
                    words = results.data;
                    filteredWords = words;
                    resetUsedIndices();
                    callback();
                }
            });
        }

        function resetUsedIndices() {
            usedIndices.clear();
        }

        function getNextWord() {
            let availableIndices = filteredWords
                .map((_, index) => index)
                .filter(index => !usedIndices.has(index));

            if (availableIndices.length === 0) {
                // If we've used all words, reset
                resetUsedIndices();
                availableIndices = filteredWords.map((_, index) => index);
            }

            // Pick a random index from available ones
            const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            usedIndices.add(randomIndex);
            return filteredWords[randomIndex];
        }

        function showNextWord() {
            currentWord = getNextWord();
            document.getElementById('wordDisplay').innerText = currentWord.word;
        }

        function showMeaning(playSound = true) {
            if (currentWord) {
                alert("Meaning: " + currentWord.meaning);
                if (playSound) {
                    const utterance = new SpeechSynthesisUtterance(currentWord.meaning);
                    speechSynthesis.speak(utterance);
                }
            }
        }

        function filterWordsByLetter(letter) {
            if (letter === 'all') {
                filteredWords = words;
            } else {
                filteredWords = words.filter(w => w.word.charAt(0).toUpperCase() === letter);
            }
            resetUsedIndices();
        }

        document.getElementById('nextButton').addEventListener('click', showNextWord);
        document.getElementById('showMeaning').addEventListener('click', () => showMeaning(true));
        document.getElementById('showMeaningOnly').addEventListener('click', () => showMeaning(false));

        document.querySelectorAll('.alpha-filter').forEach(button => {
            button.addEventListener('click', function() {
                const letter = this.getAttribute('data-letter');
                filterWordsByLetter(letter);
            });
        });

        loadCSV(() => {
            console.log("CSV Loaded");
        });
    </script>
</body>
</html>
